<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909"><title>DJ Dashboard</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap admin-wrap">
    <section class="panel wide">
      <div class="topline"><div><div class="eyebrow">PRIVATE DJ AREA</div><h1>Songwünsche<span>.</span></h1></div><span class="live"><i></i> LIVE</span></div>
      <p class="intro">Deine eingegangenen Wünsche</p>
      <form id="login-form" class="login-form">
        <label for="email">Admin-E-Mail</label><input id="email" type="email" placeholder="Deine E-Mail" required>
        <label for="password">Passwort</label><input id="password" type="password" placeholder="Passwort" required>
        <button type="submit">Einloggen <span>→</span></button><p id="login-status" class="status" role="status"></p>
      </form>
      <div id="dashboard" hidden>
        <div class="dashbar"><span id="count">0 Songwünsche</span><button id="logout" class="secondary" type="button">Abmelden</button></div>
        <div id="requests" class="requests"><p class="empty">Noch keine Songwünsche.</p></div>
      </div>
      <footer>Nur für dich sichtbar · Neue Wünsche erscheinen automatisch</footer>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="admin.js"></script>
</body></html>
