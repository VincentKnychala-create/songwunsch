<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Songwunsch</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="eyebrow">DJ REQUESTS</div>
      <h1>Songwunsch<span>.</span></h1>
      <p class="intro">Welchen Song soll ich spielen?</p>
      <form id="request-form">
        <label for="name">Dein Name</label>
        <input id="name" name="name" maxlength="40" placeholder="Wie heißt du?" required>
        <label for="song">Dein Songwunsch</label>
        <input id="song" name="song" maxlength="120" placeholder="Interpret – Songtitel" required>
        <label for="message">Deine Botschaft <small>(optional)</small></label>
        <textarea id="message" name="message" maxlength="400" rows="4" placeholder="Möchtest du noch etwas sagen?"></textarea>
        <button id="submit" type="submit">Songwunsch senden <span>→</span></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="lookup-section">
  <label for="request-code">Dein persönlicher Song-Code</label>
  <input id="request-code" placeholder="Code eingeben">
  <button id="check-status" type="button">
    Status überprüfen
  </button>
  <p id="lookup-result" class="status"></p>
</div>
      </form>
      <footer>Danke für deinen Songwunsch 🖤</footer>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="app.js"></script>
</body></html>
